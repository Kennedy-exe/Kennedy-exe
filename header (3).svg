<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <style>
      .vt { font-family: 'VT323', 'Courier New', monospace; }
      .ps2 { font-family: 'Press Start 2P', 'Courier New', monospace; }

      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

      .bar1 { animation: grow1 1.2s 0.5s ease both; }
      .bar2 { animation: grow2 1.2s 0.8s ease both; }
      .bar3 { animation: grow3 1.2s 1.1s ease both; }
      .bar4 { animation: grow4 1.2s 1.4s ease both; }
      @keyframes grow1 { from{width:0} to{width:131px} }
      @keyframes grow2 { from{width:0} to{width:118px} }
      @keyframes grow3 { from{width:0} to{width:109px} }
      @keyframes grow4 { from{width:0} to{width:88px}  }

      /* Cada frase: aparece, fica visível, some. Ciclo de 16s */
      /* Frase 1: 0-4s visível */
      .f1 { animation: fa1 16s 0s infinite; }
      /* Frase 2: 4-8s visível */
      .f2 { animation: fa2 16s 0s infinite; }
      /* Frase 3: 8-12s visível */
      .f3 { animation: fa3 16s 0s infinite; }
      /* Frase 4: 12-16s visível */
      .f4 { animation: fa4 16s 0s infinite; }

      @keyframes fa1 {
        0%   { opacity:1 }
        22%  { opacity:1 }
        25%  { opacity:0 }
        100% { opacity:0 }
      }
      @keyframes fa2 {
        0%   { opacity:0 }
        25%  { opacity:0 }
        27%  { opacity:1 }
        47%  { opacity:1 }
        50%  { opacity:0 }
        100% { opacity:0 }
      }
      @keyframes fa3 {
        0%   { opacity:0 }
        50%  { opacity:0 }
        52%  { opacity:1 }
        72%  { opacity:1 }
        75%  { opacity:0 }
        100% { opacity:0 }
      }
      @keyframes fa4 {
        0%   { opacity:0 }
        75%  { opacity:0 }
        77%  { opacity:1 }
        97%  { opacity:1 }
        100% { opacity:0 }
      }

      .flicker { animation: flk 9s infinite; }
      @keyframes flk {
        0%,91%,93%,96%,98%,100% { opacity:0 }
        92% { opacity:0.04 }
        97% { opacity:0.03 }
      }
    </style>

    <clipPath id="bc1"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <clipPath id="bc2"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <clipPath id="bc3"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <clipPath id="bc4"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000" y="3"/>
    </pattern>
  </defs>

  <!-- Desktop BG -->
  <rect width="800" height="320" fill="#008080"/>
  <!-- Scanlines -->
  <rect width="800" height="320" fill="url(#scan)" opacity="0.10"/>
  <!-- CRT flicker -->
  <rect class="flicker" width="800" height="320" fill="#fff"/>

  <!-- Desktop icons -->
  <g transform="translate(18,14)">
    <rect width="32" height="32" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <rect x="2" y="3" width="28" height="20" fill="#000080"/>
    <rect x="4" y="5" width="24" height="16" fill="#000050"/>
    <rect x="5" y="7" width="4" height="3" fill="#00ff00"/>
    <rect x="5" y="12" width="6" height="2" fill="#00ff00"/>
    <rect x="5" y="16" width="5" height="2" fill="#00ff00"/>
    <rect x="12" y="23" width="8" height="3" fill="#808080"/>
    <rect x="7" y="26" width="18" height="2" fill="#808080"/>
    <text x="16" y="46" font-family="VT323,monospace" font-size="13" fill="#fff" text-anchor="middle">kenny.exe</text>
  </g>
  <g transform="translate(18,74)">
    <rect width="32" height="26" fill="#e0b060" stroke="#000" stroke-width="1"/>
    <rect x="0" y="-6" width="14" height="8" fill="#e0b060" stroke="#000" stroke-width="1"/>
    <rect x="2" y="4" width="14" height="2" fill="#000080"/>
    <rect x="2" y="8" width="12" height="1" fill="#808080"/>
    <rect x="2" y="11" width="13" height="1" fill="#808080"/>
    <rect x="2" y="14" width="11" height="1" fill="#808080"/>
    <text x="16" y="36" font-family="VT323,monospace" font-size="13" fill="#fff" text-anchor="middle">projetos</text>
  </g>
  <g transform="translate(18,138)">
    <rect width="32" height="32" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <rect x="4" y="8"  width="24" height="4" fill="#000080"/>
    <rect x="4" y="14" width="18" height="4" fill="#000060"/>
    <rect x="4" y="20" width="22" height="4" fill="#000080"/>
    <text x="16" y="46" font-family="VT323,monospace" font-size="13" fill="#fff" text-anchor="middle">skills</text>
  </g>

  <!-- Window shadow -->
  <rect x="72" y="15" width="706" height="276" fill="#808080"/>
  <!-- Window body -->
  <rect x="70" y="13" width="706" height="276" fill="#c0c0c0"/>
  <rect x="70" y="13" width="706" height="2" fill="#fff"/>
  <rect x="70" y="13" width="2"   height="276" fill="#fff"/>
  <rect x="70" y="287" width="706" height="2" fill="#808080"/>
  <rect x="774" y="13" width="2"  height="276" fill="#808080"/>

  <!-- Titlebar -->
  <rect x="72" y="15" width="702" height="22" fill="#000080"/>
  <rect x="76" y="19" width="7"  height="6" fill="#ff0000"/>
  <rect x="84" y="19" width="7"  height="6" fill="#00ff00"/>
  <rect x="76" y="26" width="7"  height="6" fill="#0000ff"/>
  <rect x="84" y="26" width="7"  height="6" fill="#ffff00"/>
