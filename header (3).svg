  </g>
  <text x="380" y="221" font-family="VT323,monospace" font-size="16" fill="#000">68%</text>

  <!-- JavaScript -->
  <text x="90" y="241" font-family="VT323,monospace" font-size="17" fill="#000">JavaScript</text>
  <rect x="212" y="229" width="162" height="14" fill="#808080"/>
  <rect x="213" y="230" width="160" height="12" fill="#dfdfdf"/>
  <g clip-path="url(#bc4)" transform="translate(213,230)">
    <rect class="bar4" x="0" y="0" height="12" fill="#000080"/>
