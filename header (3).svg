  <!-- Name (shadow then real) -->
  <text x="403" y="103" font-family="'Press Start 2P',monospace" font-size="30" fill="#808080" text-anchor="middle" letter-spacing="2">KENNY</text>
  <text x="400" y="100" font-family="'Press Start 2P',monospace" font-size="30" fill="#000080" text-anchor="middle" letter-spacing="2">KENNY</text>

  <!-- Subtitle -->
  <text x="400" y="120" font-family="VT323,monospace" font-size="19" fill="#000080" text-anchor="middle">Estudante de Tecnologia  ·  C  ·  Python  ·  Linux</text>

  <!-- Divider 1 -->
  <rect x="88" y="128" width="622" height="1" fill="#808080"/>
  <rect x="88" y="129" width="622" height="1" fill="#fff"/>

  <!-- Prompt label (static) -->
  <text x="90" y="150" font-family="VT323,monospace" font-size="19" fill="#000080">C:\Users\Kenny&gt;</text>

  <!-- Typing phrases — stacked at same position, fading in/out -->
  <text class="f1" x="212" y="150" font-family="VT323,monospace" font-size="19" fill="#000">Apaixonado por baixo nivel</text>
  <text class="f2" x="212" y="150" font-family="VT323,monospace" font-size="19" fill="#000">Explorando C e ponteiros...</text>
  <text class="f3" x="212" y="150" font-family="VT323,monospace" font-size="19" fill="#000">Linux e meu habitat natural</text>
  <text class="f4" x="212" y="150" font-family="VT323,monospace" font-size="19" fill="#000">Seguranca ofensiva em breve</text>

  <!-- Blinking cursor after prompt -->
