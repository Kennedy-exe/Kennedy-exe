  <!-- Divider 2 -->
  <rect x="88" y="160" width="622" height="1" fill="#808080"/>
  <rect x="88" y="161" width="622" height="1" fill="#fff"/>

  <!-- Progress bars -->
  <!-- C / ponteiros -->
  <text x="90" y="181" font-family="VT323,monospace" font-size="17" fill="#000">C / ponteiros</text>
  <rect x="212" y="169" width="162" height="14" fill="#808080"/>
