  </g>
  <text x="380" y="181" font-family="VT323,monospace" font-size="16" fill="#000">82%</text>

  <!-- Linux / Shell -->
  <text x="90" y="201" font-family="VT323,monospace" font-size="17" fill="#000">Linux / Shell</text>
  <rect x="212" y="189" width="162" height="14" fill="#808080"/>
  <rect x="213" y="190" width="160" height="12" fill="#dfdfdf"/>
  <g clip-path="url(#bc2)" transform="translate(213,190)">
    <rect class="bar2" x="0" y="0" height="12" fill="#000080"/>
  </g>
  <text x="380" y="201" font-family="VT323,monospace" font-size="16" fill="#000">74%</text>

  <!-- Python -->
  <text x="90" y="221" font-family="VT323,monospace" font-size="17" fill="#000">Python</text>
  <rect x="212" y="209" width="162" height="14" fill="#808080"/>
  <rect x="213" y="210" width="160" height="12" fill="#dfdfdf"/>
  <g clip-path="url(#bc3)" transform="translate(213,210)">
