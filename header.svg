<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=VT323&amp;family=Press+Start+2P&amp;display=swap');

      .vt { font-family: 'VT323', 'Courier New', monospace; }
      .ps2 { font-family: 'Press Start 2P', 'Courier New', monospace; }

      .name-text {
        font-family: 'Press Start 2P', monospace;
        font-size: 32px;
        fill: #000080;
      }

      .cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%,100%{opacity:1} 50%{opacity:0}
      }

      .bar1 { animation: grow1 1.4s 0.3s ease forwards; }
      .bar2 { animation: grow2 1.4s 0.6s ease forwards; }
      .bar3 { animation: grow3 1.4s 0.9s ease forwards; }
      .bar4 { animation: grow4 1.4s 1.2s ease forwards; }

      @keyframes grow1 { from{width:0} to{width:131px} }
      @keyframes grow2 { from{width:0} to{width:118px} }
      @keyframes grow3 { from{width:0} to{width:109px} }
      @keyframes grow4 { from{width:0} to{width:88px} }

      .t1 { animation: type1 2s steps(28,end) 0.5s forwards; }
      .t2 { animation: type2 2s steps(24,end) 3.5s forwards; }
      .t3 { animation: type3 2s steps(26,end) 6.5s forwards; }
      .t4 { animation: type4 2s steps(22,end) 9.5s forwards; }

      @keyframes type1 {
        from { width: 0 }
        to   { width: 224px }
      }
      @keyframes type2 {
        from { width: 0 }
        to   { width: 192px }
      }
      @keyframes type3 {
        from { width: 0 }
        to   { width: 208px }
      }
      @keyframes type4 {
        from { width: 0 }
        to   { width: 176px }
      }

      .ph1 { animation: ph1a 12s 0s infinite; }
      .ph2 { animation: ph2a 12s 0s infinite; }
      .ph3 { animation: ph3a 12s 0s infinite; }
      .ph4 { animation: ph4a 12s 0s infinite; }
      .phc { animation: phca 12s 0s infinite; }

      @keyframes ph1a {
        0%   { width:0 }  8%  { width:220px } 24% { width:220px }
        28%  { width:0 }  100%{ width:0 }
      }
      @keyframes ph2a {
        0%   { width:0 }  28% { width:0 }    36% { width:188px }
        52%  { width:188px } 56%{ width:0 }  100%{ width:0 }
      }
      @keyframes ph3a {
        0%   { width:0 }  56% { width:0 }    64% { width:204px }
        80%  { width:204px } 84%{ width:0 }  100%{ width:0 }
      }
      @keyframes ph4a {
        0%   { width:0 }  84% { width:0 }    92% { width:172px }
        100% { width:172px }
      }
      @keyframes phca {
        0%,24%  { opacity:1 } 25%,27% { opacity:0 }
        28%,52% { opacity:1 } 53%,55% { opacity:0 }
        56%,80% { opacity:1 } 81%,83% { opacity:0 }
        84%,100%{ opacity:1 }
      }

      .flicker { animation: flk 7s infinite; }
      @keyframes flk {
        0%,100%{opacity:0} 92%{opacity:0} 92.5%{opacity:0.04} 93%{opacity:0} 96%{opacity:0} 96.5%{opacity:0.03} 97%{opacity:0}
      }
    </style>

    <clipPath id="clip1"><rect x="0" y="0" width="220" height="22"/></clipPath>
    <clipPath id="clip2"><rect x="0" y="0" width="220" height="22"/></clipPath>
    <clipPath id="clip3"><rect x="0" y="0" width="220" height="22"/></clipPath>
    <clipPath id="clip4"><rect x="0" y="0" width="220" height="22"/></clipPath>

    <clipPath id="barclip1"><rect x="0" y="0" width="160" height="14"/></clipPath>
    <clipPath id="barclip2"><rect x="0" y="0" width="160" height="14"/></clipPath>
    <clipPath id="barclip3"><rect x="0" y="0" width="160" height="14"/></clipPath>
    <clipPath id="barclip4"><rect x="0" y="0" width="160" height="14"/></clipPath>
  </defs>

  <!-- BG desktop teal -->
  <rect width="800" height="320" fill="#008080"/>

  <!-- Scanlines overlay -->
  <rect width="800" height="320" fill="url(#scan)" opacity="0.12"/>
  <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
    <rect width="1" height="1" fill="#000" y="3"/>
  </pattern>

  <!-- CRT flicker layer -->
  <rect class="flicker" width="800" height="320" fill="#fff"/>

  <!-- Desktop icons (left side) -->
  <!-- Icon: kenny.exe -->
  <g transform="translate(18,18)">
    <rect width="32" height="32" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <rect x="2" y="3" width="28" height="20" fill="#000080"/>
    <rect x="4" y="5" width="24" height="16" fill="#000040"/>
    <rect x="5" y="7" width="4" height="3" fill="#00ff00"/>
    <rect x="5" y="12" width="6" height="2" fill="#00ff00"/>
    <rect x="5" y="16" width="5" height="2" fill="#00ff00"/>
    <rect x="12" y="23" width="8" height="3" fill="#808080"/>
    <rect x="7" y="26" width="18" height="2" fill="#808080"/>
    <text x="16" y="46" font-family="'VT323',monospace" font-size="13" fill="#fff" text-anchor="middle">kenny.exe</text>
  </g>

  <!-- Icon: projetos -->
  <g transform="translate(18,80)">
    <rect width="32" height="26" fill="#e0b060" stroke="#000" stroke-width="1"/>
    <rect x="0" y="-6" width="14" height="8" fill="#e0b060" stroke="#000" stroke-width="1"/>
    <rect x="2" y="4" width="14" height="2" fill="#000080"/>
    <rect x="2" y="8" width="12" height="1" fill="#808080"/>
    <rect x="2" y="11" width="13" height="1" fill="#808080"/>
    <rect x="2" y="14" width="11" height="1" fill="#808080"/>
    <text x="16" y="36" font-family="'VT323',monospace" font-size="13" fill="#fff" text-anchor="middle">projetos</text>
  </g>

  <!-- Icon: skills -->
  <g transform="translate(18,148)">
    <rect width="32" height="32" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <rect x="4" y="8" width="24" height="4" fill="#000080"/>
    <rect x="4" y="14" width="18" height="4" fill="#000060"/>
    <rect x="4" y="20" width="22" height="4" fill="#000080"/>
    <text x="16" y="46" font-family="'VT323',monospace" font-size="13" fill="#fff" text-anchor="middle">skills</text>
  </g>

  <!-- MAIN WINDOW -->
  <!-- outer shadow -->
  <rect x="70" y="14" width="706" height="278" fill="#808080"/>
  <!-- window body -->
  <rect x="68" y="12" width="706" height="278" fill="#c0c0c0"/>
  <!-- top highlight -->
  <rect x="68" y="12" width="706" height="2" fill="#fff"/>
  <rect x="68" y="12" width="2" height="278" fill="#fff"/>
  <!-- bottom shadow -->
  <rect x="68" y="288" width="706" height="2" fill="#808080"/>
  <rect x="772" y="12" width="2" height="278" fill="#808080"/>

  <!-- TITLEBAR -->
  <rect x="70" y="14" width="702" height="22" fill="#000080"/>

  <!-- Win logo small -->
  <rect x="74" y="18" width="7" height="6" fill="#ff0000"/>
  <rect x="82" y="18" width="7" height="6" fill="#00ff00"/>
  <rect x="74" y="25" width="7" height="6" fill="#0000ff"/>
  <rect x="82" y="25" width="7" height="6" fill="#ffff00"/>

  <text x="96" y="29" font-family="'VT323',monospace" font-size="16" fill="#fff">Kenny — Perfil de Desenvolvedor</text>

  <!-- Titlebar buttons -->
  <!-- minimize -->
  <rect x="728" y="16" width="18" height="16" fill="#c0c0c0" stroke-width="0"/>
  <rect x="728" y="16" width="18" height="1" fill="#fff"/>
  <rect x="728" y="16" width="1" height="16" fill="#fff"/>
  <rect x="745" y="16" width="1" height="16" fill="#808080"/>
  <rect x="728" y="31" width="18" height="1" fill="#808080"/>
  <text x="737" y="28" font-family="monospace" font-size="11" fill="#000" text-anchor="middle">_</text>

  <!-- maximize -->
  <rect x="748" y="16" width="18" height="16" fill="#c0c0c0"/>
  <rect x="748" y="16" width="18" height="1" fill="#fff"/>
  <rect x="748" y="16" width="1" height="16" fill="#fff"/>
  <rect x="765" y="16" width="1" height="16" fill="#808080"/>
  <rect x="748" y="31" width="18" height="1" fill="#808080"/>
  <text x="757" y="28" font-family="monospace" font-size="11" fill="#000" text-anchor="middle">□</text>

  <!-- close -->
  <rect x="768" y="16" width="18" height="16" fill="#c0c0c0"/>
  <rect x="768" y="16" width="18" height="1" fill="#fff"/>
  <rect x="768" y="16" width="1" height="16" fill="#fff"/>
  <rect x="785" y="16" width="1" height="16" fill="#808080"/>
  <rect x="768" y="31" width="18" height="1" fill="#808080"/>
  <text x="777" y="28" font-family="monospace" font-size="11" fill="#000" text-anchor="middle">✕</text>

  <!-- MENU BAR -->
  <rect x="70" y="36" width="702" height="18" fill="#c0c0c0"/>
  <rect x="70" y="54" width="702" height="1" fill="#808080"/>
  <text x="80" y="49" font-family="'VT323',monospace" font-size="15" fill="#000">Arquivo</text>
  <text x="132" y="49" font-family="'VT323',monospace" font-size="15" fill="#000">Editar</text>
  <text x="180" y="49" font-family="'VT323',monospace" font-size="15" fill="#000">Exibir</text>
  <text x="224" y="49" font-family="'VT323',monospace" font-size="15" fill="#000">Ajuda</text>

  <!-- WINDOW CONTENT AREA -->
  <rect x="70" y="55" width="702" height="233" fill="#c0c0c0"/>

  <!-- Pixel name -->
  <text x="400" y="102" font-family="'Press Start 2P','Courier New',monospace" font-size="30" fill="#000080" text-anchor="middle" letter-spacing="2">KENNY</text>
  <!-- name shadow -->
  <text x="403" y="105" font-family="'Press Start 2P','Courier New',monospace" font-size="30" fill="#808080" text-anchor="middle" letter-spacing="2" opacity="0.5">KENNY</text>
  <text x="400" y="102" font-family="'Press Start 2P','Courier New',monospace" font-size="30" fill="#000080" text-anchor="middle" letter-spacing="2">KENNY</text>

  <!-- subtitle -->
  <text x="400" y="122" font-family="'VT323',monospace" font-size="19" fill="#000080" text-anchor="middle">Estudante de Tecnologia · C · Python · Linux</text>

  <!-- divider -->
  <rect x="86" y="130" width="628" height="1" fill="#808080"/>
  <rect x="86" y="131" width="628" height="1" fill="#fff"/>

  <!-- Typing prompt -->
  <text x="88" y="152" font-family="'VT323',monospace" font-size="19" fill="#000080">C:\Users\Kenny&gt;</text>

  <!-- Typing text phases (clip to simulate typing) -->
  <g transform="translate(210,133)">
    <clipPath id="ph1clip"><rect class="ph1" x="0" y="0" height="22"/></clipPath>
    <clipPath id="ph2clip"><rect class="ph2" x="0" y="0" height="22"/></clipPath>
    <clipPath id="ph3clip"><rect class="ph3" x="0" y="0" height="22"/></clipPath>
    <clipPath id="ph4clip"><rect class="ph4" x="0" y="0" height="22"/></clipPath>

    <text clip-path="url(#ph1clip)" x="0" y="19" font-family="'VT323',monospace" font-size="19" fill="#000">Apaixonado por baixo nível_</text>
    <text clip-path="url(#ph2clip)" x="0" y="19" font-family="'VT323',monospace" font-size="19" fill="#000">Explorando C e ponteiros..._</text>
    <text clip-path="url(#ph3clip)" x="0" y="19" font-family="'VT323',monospace" font-size="19" fill="#000">Linux é meu habitat natural_</text>
    <text clip-path="url(#ph4clip)" x="0" y="19" font-family="'VT323',monospace" font-size="19" fill="#000">Segurança ofensiva em breve_</text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor phc" x="210" y="135" width="10" height="16" fill="#000"/>

  <!-- divider 2 -->
  <rect x="86" y="162" width="628" height="1" fill="#808080"/>
  <rect x="86" y="163" width="628" height="1" fill="#fff"/>

  <!-- PROGRESS BARS -->
  <!-- Row 1: C / ponteiros -->
  <text x="88" y="183" font-family="'VT323',monospace" font-size="17" fill="#000">C / ponteiros</text>
  <rect x="210" y="170" width="160" height="14" fill="#808080"/>
  <rect x="211" y="171" width="158" height="12" fill="#c0c0c0"/>
  <g clip-path="url(#barclip1)" transform="translate(211,171)">
    <rect class="bar1" x="0" y="0" height="12" fill="#000080"/>
  </g>
  <text x="376" y="182" font-family="'VT323',monospace" font-size="16" fill="#000">82%</text>

  <!-- Row 2: Linux / Shell -->
  <text x="88" y="204" font-family="'VT323',monospace" font-size="17" fill="#000">Linux / Shell</text>
  <rect x="210" y="191" width="160" height="14" fill="#808080"/>
  <rect x="211" y="192" width="158" height="12" fill="#c0c0c0"/>
  <g clip-path="url(#barclip2)" transform="translate(211,192)">
    <rect class="bar2" x="0" y="0" height="12" fill="#000080"/>
  </g>
  <text x="376" y="203" font-family="'VT323',monospace" font-size="16" fill="#000">74%</text>

  <!-- Row 3: Python -->
  <text x="88" y="225" font-family="'VT323',monospace" font-size="17" fill="#000">Python</text>
  <rect x="210" y="212" width="160" height="14" fill="#808080"/>
  <rect x="211" y="213" width="158" height="12" fill="#c0c0c0"/>
  <g clip-path="url(#barclip3)" transform="translate(211,213)">
    <rect class="bar3" x="0" y="0" height="12" fill="#000080"/>
  </g>
  <text x="376" y="224" font-family="'VT323',monospace" font-size="16" fill="#000">68%</text>

  <!-- Row 4: JavaScript -->
  <text x="88" y="246" font-family="'VT323',monospace" font-size="17" fill="#000">JavaScript</text>
  <rect x="210" y="233" width="160" height="14" fill="#808080"/>
  <rect x="211" y="234" width="158" height="12" fill="#c0c0c0"/>
  <g clip-path="url(#barclip4)" transform="translate(211,234)">
    <rect class="bar4" x="0" y="0" height="12" fill="#000080"/>
  </g>
  <text x="376" y="245" font-family="'VT323',monospace" font-size="16" fill="#000">55%</text>

  <!-- STATUS BAR -->
  <rect x="70" y="276" width="702" height="14" fill="#c0c0c0"/>
  <rect x="70" y="276" width="702" height="1" fill="#808080"/>
  <text x="76" y="286" font-family="'VT323',monospace" font-size="13" fill="#000">Pronto</text>
  <rect x="160" y="278" width="1" height="10" fill="#808080"/>
  <text x="166" y="286" font-family="'VT323',monospace" font-size="13" fill="#000">kennedy-exe/Kennedy-exe</text>

  <!-- TASKBAR -->
  <rect x="0" y="298" width="800" height="22" fill="#c0c0c0"/>
  <rect x="0" y="298" width="800" height="2" fill="#fff"/>

  <!-- Start button -->
  <rect x="2" y="300" width="58" height="18" fill="#c0c0c0"/>
  <rect x="2" y="300" width="58" height="1" fill="#fff"/>
  <rect x="2" y="300" width="1" height="18" fill="#fff"/>
  <rect x="59" y="300" width="1" height="18" fill="#808080"/>
  <rect x="2" y="317" width="58" height="1" fill="#808080"/>
  <rect x="4" y="302" width="7" height="6" fill="#ff0000"/>
  <rect x="12" y="302" width="7" height="6" fill="#00ff00"/>
  <rect x="4" y="309" width="7" height="6" fill="#0000ff"/>
  <rect x="12" y="309" width="7" height="6" fill="#ffff00"/>
  <text x="22" y="314" font-family="'VT323',monospace" font-size="16" fill="#000" font-weight="bold">Start</text>

  <!-- Task item -->
  <rect x="64" y="301" width="120" height="16" fill="#c0c0c0"/>
  <rect x="64" y="301" width="120" height="1" fill="#808080"/>
  <rect x="64" y="301" width="1" height="16" fill="#808080"/>
  <rect x="183" y="301" width="1" height="16" fill="#fff"/>
  <rect x="64" y="316" width="120" height="1" fill="#fff"/>
  <text x="70" y="313" font-family="'VT323',monospace" font-size="14" fill="#000">kenny.exe</text>

  <!-- Clock -->
  <rect x="740" y="300" width="58" height="18" fill="#c0c0c0"/>
  <rect x="740" y="300" width="1" height="18" fill="#808080"/>
  <rect x="740" y="300" width="58" height="1" fill="#808080"/>
  <rect x="797" y="300" width="1" height="18" fill="#fff"/>
  <rect x="740" y="317" width="58" height="1" fill="#fff"/>
  <text x="769" y="313" font-family="'VT323',monospace" font-size="14" fill="#000" text-anchor="middle">23:59</text>

</svg>
