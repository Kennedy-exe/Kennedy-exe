<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <style>
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
      .bar1 { animation: grow1 1.2s 0.5s ease both; }
      .bar2 { animation: grow2 1.2s 0.8s ease both; }
      .bar3 { animation: grow3 1.2s 1.1s ease both; }
      .bar4 { animation: grow4 1.2s 1.4s ease both; }
      .bar5 { animation: grow5 1.2s 1.7s ease both; }
      @keyframes grow1 { from{width:0} to{width:131px} }
      @keyframes grow2 { from{width:0} to{width:118px} }
      @keyframes grow3 { from{width:0} to{width:109px} }
      @keyframes grow4 { from{width:0} to{width:88px}  }
      @keyframes grow5 { from{width:0} to{width:96px}  }
      .flicker { animation: flk 9s infinite; }
      @keyframes flk {
        0%,91%,93%,96%,98%,100%{opacity:0}
        92%{opacity:0.04} 97%{opacity:0.03}
      }
    </style>
    <clipPath id="bc1"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <clipPath id="bc2"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <clipPath id="bc3"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <clipPath id="bc4"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <clipPath id="bc5"><rect x="0" y="0" width="158" height="12"/></clipPath>
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000" y="3"/>
    </pattern>
  </defs>

  <!-- Desktop BG -->
  <rect width="800" height="320" fill="#008080"/>
  <rect width="800" height="320" fill="url(#scan)" opacity="0.10"/>
  <rect class="flicker" width="800" height="320" fill="#fff"/>

  <!-- ===================== DESKTOP ICONS (tech stack) ===================== -->

  <!-- C icon -->
  <g transform="translate(10,12)">
    <rect width="36" height="36" fill="#00599C" stroke="#003366" stroke-width="1"/>
    <text x="18" y="25" font-family="'Press Start 2P',monospace" font-size="14" fill="#fff" text-anchor="middle">C</text>
    <text x="18" y="50" font-family="VT323,monospace" font-size="13" fill="#fff" text-anchor="middle">C</text>
  </g>

  <!-- Python icon -->
  <g transform="translate(10,74)">
    <rect width="36" height="36" fill="#3776AB" stroke="#225588" stroke-width="1"/>
    <!-- snake simplified: two circles -->
    <ellipse cx="13" cy="13" rx="7" ry="7" fill="#FFD43B"/>
    <ellipse cx="23" cy="23" rx="7" ry="7" fill="#4B8BBE"/>
    <rect x="12" y="12" width="12" height="12" fill="#3776AB"/>
    <text x="18" y="50" font-family="VT323,monospace" font-size="13" fill="#fff" text-anchor="middle">Python</text>
  </g>

  <!-- JavaScript icon -->
  <g transform="translate(10,136)">
    <rect width="36" height="36" fill="#F7DF1E" stroke="#c8b800" stroke-width="1"/>
    <text x="18" y="26" font-family="'Press Start 2P',monospace" font-size="11" fill="#000" text-anchor="middle">JS</text>
    <text x="18" y="50" font-family="VT323,monospace" font-size="13" fill="#fff" text-anchor="middle">JS</text>
  </g>

  <!-- HTML5 icon -->
  <g transform="translate(10,198)">
    <rect width="36" height="36" fill="#E34F26" stroke="#b03000" stroke-width="1"/>
    <text x="18" y="26" font-family="'Press Start 2P',monospace" font-size="8" fill="#fff" text-anchor="middle">HTML</text>
    <text x="18" y="50" font-family="VT323,monospace" font-size="13" fill="#fff" text-anchor="middle">HTML</text>
  </g>

